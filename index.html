<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SURGlove</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#e9eff4;color:#102841;font:16px system-ui,sans-serif}main{max-width:680px;margin:auto;padding:22px;min-height:100dvh;display:flex;flex-direction:column;gap:16px}h1,p{margin:0}p{color:#405a71}canvas{display:block;width:100%;height:min(61dvh,560px);background:linear-gradient(#d4dfe9,#f7f9fb);border-radius:16px;touch-action:none}nav{display:flex;gap:10px}button{flex:1;border:0;border-radius:10px;min-height:50px;background:#183a59;color:white;font:inherit;font-weight:650}button:disabled{opacity:.45}

<main>
<h1>SURGlove</h1>
<p id="status" role="status">장갑을 켜고 연결을 눌러주세요.</p>
<canvas id="hand" aria-label="3D 장갑 자세"></canvas>
<nav><button id="connect">장갑 연결</button><button id="zero" disabled>초기 자세 설정 (N)</button></nav>
</main>
